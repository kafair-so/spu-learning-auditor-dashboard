<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1120 140 940 980" role="img">
  <style>
    .robot-eye{
      transform-box:fill-box;
      transform-origin:center;
      animation:robotBlink 5.2s ease-in-out infinite;
    }
    .robot-eye.right{animation-delay:.04s}
    .wave-arm{
      transform-box:fill-box;
      transform-origin:12% 8%;
      animation:robotWave 6.8s ease-in-out 1.5s infinite;
    }
    @keyframes robotBlink{
      0%,44%,48%,100%{transform:scaleY(1)}
      46%{transform:scaleY(.08)}
    }
    @keyframes robotWave{
      0%,12%,42%,100%{transform:rotate(0deg)}
      17%{transform:rotate(-24deg)}
      22%{transform:rotate(-10deg)}
      27%{transform:rotate(-25deg)}
      32%{transform:rotate(-9deg)}
      37%{transform:rotate(-22deg)}
    }
    @media (prefers-reduced-motion:reduce){
      .robot-eye,.wave-arm{animation:none}
    }
  </style>
