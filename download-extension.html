<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ดาวน์โหลด SPU Learning Auditor 0.13.28</title>
  <style>
    :root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#15375e;background:#eef4fb}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(620px,100%);padding:32px;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(20,55,94,.14);text-align:center}h1{margin:0 0 10px;font-size:25px}p{line-height:1.65;color:#52667f}.progress{height:10px;margin:22px 0;border-radius:999px;background:#e6eef8;overflow:hidden}.bar{width:0;height:100%;background:#2167c7;transition:width .2s}.status{min-height:48px;font-weight:700}button{border:0;border-radius:10px;padding:12px 20px;background:#2167c7;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{cursor:wait;opacity:.65}.error{color:#b42318}.ok{color:#08704a}.small{font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h1>กำลังเตรียม Extension 0.13.28</h1>
    <p>ระบบจะดาวน์โหลดไฟล์ทั้งสองส่วน ตรวจความครบถ้วน แล้วรวมเป็น ZIP ที่สมบูรณ์ให้อัตโนมัติ</p>
    <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">กำลังเริ่มดาวน์โหลด…</div>
    <button id="retry" type="button" hidden>ลองดาวน์โหลดอีกครั้ง</button>
    <p class="small">ไฟล์ที่ได้ชื่อ <b>SPU-Learning-Auditor-Dashboard-0.13.28.zip</b></p>
  </main>
  <script>
    const PARTS=[
      {url:"extension-0.13.28.part1",size:4500000},
      {url:"extension-0.13.28.part2",size:4853370}
    ];
    const EXPECTED_SIZE=9353370;
    const EXPECTED_SHA256="B03D7BE26D727099158BB044B3A5AB951A8B42D6C1BCC93102BCABAED291CD81";
    const status=document.querySelector("#status"),bar=document.querySelector("#bar"),retry=document.querySelector("#retry");
    const hex=buffer=>[...new Uint8Array(buffer)].map(value=>value.toString(16).padStart(2,"0")).join("").toUpperCase();
    async function downloadArchive(){
      retry.hidden=true;retry.disabled=true;status.className="status";bar.style.width="4%";
      try{
        const chunks=[];
        for(let index=0;index<PARTS.length;index+=1){
          status.textContent=`กำลังดาวน์โหลดส่วนที่ ${index+1} จาก ${PARTS.length}…`;
          const response=await fetch(PARTS[index].url,{cache:"no-store"});
          if(!response.ok)throw new Error(`ดาวน์โหลดส่วนที่ ${index+1} ไม่สำเร็จ (${response.status})`);
          const bytes=new Uint8Array(await response.arrayBuffer());
          if(bytes.byteLength!==PARTS[index].size)throw new Error(`ส่วนที่ ${index+1} ได้ข้อมูลไม่ครบ`);
          chunks.push(bytes);bar.style.width=`${45*(index+1)}%`;
        }
        const merged=new Uint8Array(EXPECTED_SIZE);let offset=0;
        for(const chunk of chunks){merged.set(chunk,offset);offset+=chunk.byteLength;}
        if(offset!==EXPECTED_SIZE)throw new Error("ขนาด ZIP หลังรวมไม่ถูกต้อง");
        status.textContent="กำลังตรวจความสมบูรณ์ของไฟล์…";bar.style.width="94%";
        const digest=hex(await crypto.subtle.digest("SHA-256",merged));
        if(digest!==EXPECTED_SHA256)throw new Error("ค่า SHA-256 ไม่ตรง ไฟล์อาจดาวน์โหลดไม่ครบ");
        const url=URL.createObjectURL(new Blob([merged],{type:"application/zip"}));
        const link=document.createElement("a");link.href=url;link.download="SPU-Learning-Auditor-Dashboard-0.13.28.zip";document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),30000);bar.style.width="100%";status.className="status ok";status.textContent="ไฟล์สมบูรณ์และเริ่มดาวน์โหลดแล้ว";
      }catch(error){bar.style.width="0";status.className="status error";status.textContent=error.message||String(error);retry.hidden=false;retry.disabled=false;}
    }
    retry.addEventListener("click",downloadArchive);downloadArchive();
  </script>
</body>
</html>
